<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Screener</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Resume Screener</h1>
      <p>Paste a job description, upload resumes, get a ranked shortlist.</p>
    </div>
  </header>

  <main class="wrap grid">
    <section class="card">
      <h2>1. Job description</h2>
      <textarea id="jd" rows="12" placeholder="Paste the job description here..."></textarea>
      <button type="button" class="link" id="sample">Use sample job description</button>

      <h2>2. Resumes</h2>
      <label class="drop" id="drop">
        <input type="file" id="files" multiple accept=".pdf,.docx,.txt" hidden>
        <strong>Click to choose files</strong> or drag them here
        <span>PDF, DOCX or TXT</span>
      </label>
      <ul id="filelist" class="files"></ul>

      <button id="go" class="primary">Rank resumes</button>
      <p id="error" class="error" hidden></p>
    </section>

    <section class="card">
      <h2>Ranking</h2>
      <p id="empty" class="muted">Results will appear here.</p>
      <div id="results"></div>
      <div id="skipped" class="muted"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let chosen = [];

    const SAMPLE = `Data Analyst
We are looking for a Data Analyst with strong Python and SQL skills. You will clean and analyze data, build dashboards in Power BI or Tableau, and present insights to stakeholders.
Requirements: Python, pandas, NumPy, SQL, data visualization, statistics, Excel, communication skills. Machine learning basics and Flask are a plus.`;

    function renderFiles() {
      $("filelist").innerHTML = chosen.map((f) => `<li>${f.name}</li>`).join("");
    }
    $("files").addEventListener("change", (e) => { chosen = [...chosen, ...e.target.files]; renderFiles(); });
    $("drop").addEventListener("dragover", (e) => e.preventDefault());
    $("drop").addEventListener("drop", (e) => {
      e.preventDefault(); chosen = [...chosen, ...e.dataTransfer.files]; renderFiles();
    });
    $("sample").addEventListener("click", () => { $("jd").value = SAMPLE; });

    $("go").addEventListener("click", async () => {
      const err = $("error"); err.hidden = true;
      const form = new FormData();
      form.append("job_description", $("jd").value);
      chosen.forEach((f) => form.append("resumes", f));

      $("go").disabled = true; $("go").textContent = "Ranking...";
      try {
        const res = await fetch("/api/rank", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong");
        show(data);
      } catch (e) {
        err.textContent = e.message; err.hidden = false;
      } finally {
        $("go").disabled = false; $("go").textContent = "Rank resumes";
      }
    });

    function show(data) {
      $("empty").hidden = true;
      $("results").innerHTML = data.ranking.map((r) => `
        <article class="cand">
          <div class="row">
            <span class="rank">#${r.rank}</span>
            <div class="who"><strong>${r.name}</strong><small>${r.filename}</small></div>
            <span class="score">${r.score}%</span>
          </div>
          <div class="bar"><i style="width:${Math.min(r.score, 100)}%"></i></div>
          <div class="tags">
            ${r.matched_keywords.map((k) => `<span class="tag ok">${k}</span>`).join("")}
            ${r.missing_keywords.map((k) => `<span class="tag miss">${k}</span>`).join("")}
          </div>
        </article>`).join("");
      $("skipped").innerHTML = data.skipped.length
        ? "Skipped: " + data.skipped.map((s) => `${s.file} (${s.reason})`).join(", ") : "";
    }
  </script>
</body>
</html>
